<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-adsense-account" content="ca-pub-2306377621460834">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Vishwam's Instant HTML Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e12;
    --panel: rgba(22, 25, 32, 0.82);
    --panel-solid: #14171e;
    --border: #262b35;
    --accent: #ffb454;
    --accent2: #5eead4;
    --html-color: #ff9d5c;
    --css-color: #6ec3ff;
    --js-color: #ffd95c;
    --text: #e7e9ee;
    --muted: #7c8393;
    --glow: 0 0 10px rgba(255, 180, 84, 0.3);
    --editor-bg: #0f1116;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "JetBrains Mono", monospace;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle at 15% -10%, rgba(255,180,84,0.06), transparent 40%),
      radial-gradient(circle at 85% 110%, rgba(94,234,212,0.05), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }
  .app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: var(--panel);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: wrap;
    gap: 10px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }
  header h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 15px; margin: 0; font-weight: 700;
    display: flex; align-items: center; gap: 9px;
    color: var(--text);
    letter-spacing: 0.01em;
  }
  header h1 .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: var(--glow);
    display: inline-block;
    animation: pulse 2.2s ease-in-out infinite;
  }
  header .sub {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
    letter-spacing: 0.02em;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.25); }
  }
  .btns { display: flex; gap: 8px; }
  button {
    background: var(--accent);
    color: #14100a;
    border: none;
    padding: 8px 16px;
    border-radius: 7px;
    font-size: 12px;
    font-family: "JetBrains Mono", monospace;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(255, 180, 84, 0.3); }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  button.secondary:hover { border-color: var(--accent2); color: var(--accent2); box-shadow: none; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 2px;
    background: var(--panel-solid);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    padding: 0 10px;
  }
  .tab {
    padding: 10px 18px;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    display: flex;
    align-items: center;
    gap: 7px;
    user-select: none;
    transition: color 0.15s, border-color 0.15s;
  }
  .tab .sq { width: 7px; height: 7px; border-radius: 2px; }
  .tab[data-tab="html"] .sq { background: var(--html-color); }
  .tab[data-tab="css"] .sq { background: var(--css-color); }
  .tab[data-tab="js"] .sq { background: var(--js-color); }
  .tab.active { color: var(--text); }
  .tab[data-tab="html"].active { border-color: var(--html-color); }
  .tab[data-tab="css"].active { border-color: var(--css-color); }
  .tab[data-tab="js"].active { border-color: var(--js-color); }
  .tab:hover { color: var(--text); }

  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
  }
  .pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    position: relative;
  }
  .pane-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    padding: 9px 14px;
    background: var(--panel-solid);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
  }
  .pane-label .hint { text-transform: none; letter-spacing: 0; opacity: 0.8; color: var(--accent2); }
  #editorWrap {
    position: relative;
    flex: 1;
    min-height: 0;
  }
  #editor {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--editor-bg);
    color: #d7ddea;
    caret-color: var(--accent);
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    line-height: 1.6;
    padding: 16px;
    tab-size: 2;
  }
  .divider {
    width: 1px;
    background: linear-gradient(180deg, transparent, var(--border) 15%, var(--border) 85%, transparent);
    flex-shrink: 0;
  }
  #preview {
    flex: 1;
    border: none;
    width: 100%;
    background: white;
  }
  /* Autocomplete dropdown */
  #autocomplete {
    position: absolute;
    z-index: 20;
    background: var(--panel-solid);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    max-height: 220px;
    overflow-y: auto;
    min-width: 170px;
    display: none;
  }
  #autocomplete .item {
    padding: 7px 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }
  #autocomplete .item .desc {
    color: var(--muted);
    font-size: 10px;
    font-family: -apple-system, sans-serif;
  }
  #autocomplete .item.active,
  #autocomplete .item:hover {
    background: var(--accent);
    color: #14100a;
  }
  #autocomplete .item.active .desc,
  #autocomplete .item:hover .desc { color: rgba(20,16,10,0.75); }

  /* Autocorrect toast */
  #correctToast {
    position: absolute;
    bottom: 12px;
    left: 14px;
    background: var(--panel-solid);
    border: 1px solid var(--accent2);
    color: var(--text);
    font-size: 11px;
    padding: 7px 11px;
    border-radius: 7px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    transform: translateY(6px);
    z-index: 20;
  }
  #correctToast.show { opacity: 1; transform: translateY(0); }

  footer {
    flex-shrink: 0;
    text-align: center;
    padding: 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    font-size: 10.5px;
    color: var(--muted);
    background: var(--panel-solid);
    border-top: 1px solid var(--border);
    letter-spacing: 0.02em;
  }
  footer span { color: var(--accent); }
  footer a { color: var(--accent2); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .sep { margin: 0 8px; opacity: 0.4; }

  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .divider { width: auto; height: 1px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1><span class="dot"></span>Vishwam's Instant HTML Viewer</h1>
      <div class="sub">HTML &middot; CSS &middot; JS &middot; live preview &middot; auto tag suggest &middot; auto spell-fix</div>
    </div>
    <div class="btns">
      <button class="secondary" id="clearBtn">Clear</button>
      <button id="downloadBtn">Download</button>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="html"><span class="sq"></span>HTML</div>
    <div class="tab" data-tab="css"><span class="sq"></span>CSS</div>
    <div class="tab" data-tab="js"><span class="sq"></span>JS</div>
  </div>

  <div class="layout">
    <div class="pane">
      <div class="pane-label">
        <span id="paneLabelText">Code — HTML</span>
        <span class="hint" id="paneHint">type &lt; for tag suggestions</span>
      </div>
      <div id="editorWrap">
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Paste or type your code here..."></textarea>
        <div id="autocomplete"></div>
        <div id="correctToast"></div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="pane">
      <div class="pane-label">Preview</div>
      <iframe id="preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    </div>
  </div>
  <footer>Developer: <span>Vishwam Patel</span><span class="sep">&middot;</span>Need a website? <a href="mailto:patelharsha680@gmail.com">patelharsha680@gmail.com</a></footer>
</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const autocompleteBox = document.getElementById('autocomplete');
  const correctToast = document.getElementById('correctToast');
  const editorWrap = document.getElementById('editorWrap');
  const tabs = document.querySelectorAll('.tab');
  const paneLabelText = document.getElementById('paneLabelText');
  const paneHint = document.getElementById('paneHint');

  /* ---------- MULTI-TAB STATE (HTML / CSS / JS) ---------- */
  const code = {
    html: `<h1>Hello, Vishwam!</h1>
<p>Edit HTML, CSS, and JS in separate tabs — the preview combines all three instantly.</p>
<button id="demoBtn">Click me</button>`,
    css: `body {
  font-family: sans-serif;
  background: #10131f;
  color: #eaeaea;
  padding: 24px;
}
h1 {
  color: #00e5ff;
}
button {
  background: #a855f7;
  color: white;
  border: none;
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
}`,
    js: `document.getElementById('demoBtn').addEventListener('click', () => {
  alert('JS is wired up!');
});`
  };
  let currentTab = 'html';

  const TAB_META = {
    html: { label: 'Code — HTML', hint: 'type < for tag suggestions' },
    css:  { label: 'Code — CSS',  hint: 'auto spell-fix on comments/text' },
    js:   { label: 'Code — JS',   hint: 'auto spell-fix on comments/text' }
  };

  function loadTab(tab) {
    code[currentTab] = editor.value; // save whatever was being edited
    currentTab = tab;
    editor.value = code[tab];
    paneLabelText.textContent = TAB_META[tab].label;
    paneHint.textContent = TAB_META[tab].hint;
    closeAutocomplete();
    editor.focus();
  }

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      loadTab(t.dataset.tab);
    });
  });

  // initialize editor with html tab content
  editor.value = code.html;

  /* ---------- FAST LIVE PREVIEW (rAF-throttled, combines all 3 tabs) ---------- */
  let renderQueued = false;
  function buildDoc() {
    code[currentTab] = editor.value; // always sync current tab before building
    return `<!DOCTYPE html>
<html>
<head>
<meta name="google-adsense-account" content="ca-pub-2306377621460834">
<meta charset="UTF-8">
<style>
${code.css}
</style>
</head>
<body>
${code.html}
<script>
${code.js}
<\/script>
</body>
</html>`;
  }
  function render() {
    preview.srcdoc = buildDoc();
    renderQueued = false;
  }
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(render);
  }
  editor.addEventListener('input', scheduleRender);
  window.addEventListener('load', render);

  clearBtn.addEventListener('click', () => {
    editor.value = '';
    code[currentTab] = '';
    editor.focus();
    scheduleRender();
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([buildDoc()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'page.html';
    a.click();
    URL.revokeObjectURL(url);
  });

  /* ---------- TAG AUTOCOMPLETE (HTML tab only) ---------- */
  const TAGS = [
    ['a', 'link'], ['abbr', 'abbreviation'], ['article', 'article'], ['aside', 'aside'],
    ['audio', 'audio player'], ['b', 'bold'], ['blockquote', 'quote block'], ['body', 'body'],
    ['br', 'line break'], ['button', 'button'], ['canvas', 'canvas'], ['code', 'code'],
    ['div', 'container'], ['em', 'emphasis'], ['footer', 'footer'], ['form', 'form'],
    ['h1', 'heading 1'], ['h2', 'heading 2'], ['h3', 'heading 3'], ['h4', 'heading 4'],
    ['head', 'head'], ['header', 'header'], ['hr', 'horizontal rule'], ['html', 'root'],
    ['i', 'italic'], ['iframe', 'iframe'], ['img', 'image'], ['input', 'input field'],
    ['label', 'label'], ['li', 'list item'], ['link', 'stylesheet link'], ['main', 'main content'],
    ['meta', 'metadata'], ['nav', 'navigation'], ['ol', 'ordered list'], ['option', 'select option'],
    ['p', 'paragraph'], ['pre', 'preformatted'], ['script', 'script'], ['section', 'section'],
    ['select', 'dropdown'], ['small', 'small text'], ['span', 'inline container'],
    ['strong', 'strong'], ['style', 'style block'], ['table', 'table'], ['tbody', 'table body'],
    ['td', 'table cell'], ['textarea', 'textarea'], ['th', 'table header'], ['thead', 'table head'],
    ['title', 'title'], ['tr', 'table row'], ['ul', 'unordered list'], ['video', 'video player']
  ];
  const SELF_CLOSING = new Set(['br','hr','img','input','meta','link']);

  let acItems = [];
  let acIndex = -1;
  let acStart = -1;

  function closeAutocomplete() {
    autocompleteBox.style.display = 'none';
    acItems = [];
    acIndex = -1;
    acStart = -1;
  }

  function openAutocompleteAt(query) {
    const q = query.toLowerCase();
    acItems = TAGS.filter(t => t[0].startsWith(q));
    if (acItems.length === 0) { closeAutocomplete(); return; }
    acIndex = 0;
    autocompleteBox.innerHTML = acItems.map((t, i) =>
      `<div class="item${i === 0 ? ' active' : ''}" data-i="${i}"><span>&lt;${t[0]}&gt;</span><span class="desc">${t[1]}</span></div>`
    ).join('');
    positionAutocomplete();
    autocompleteBox.style.display = 'block';
  }

  let charWidthCache = null;
  function getCharWidth() {
    if (charWidthCache) return charWidthCache;
    const span = document.createElement('span');
    span.style.font = getComputedStyle(editor).font;
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.style.whiteSpace = 'pre';
    span.textContent = '0000000000';
    document.body.appendChild(span);
    charWidthCache = span.getBoundingClientRect().width / 10;
    document.body.removeChild(span);
    return charWidthCache;
  }

  function positionAutocomplete() {
    const style = getComputedStyle(editor);
    const paddingLeft = parseFloat(style.paddingLeft) || 0;
    const paddingTop = parseFloat(style.paddingTop) || 0;
    let lineHeight = parseFloat(style.lineHeight);
    if (isNaN(lineHeight)) lineHeight = parseFloat(style.fontSize) * 1.6;
    const charWidth = getCharWidth();

    const beforeCaret = editor.value.substring(0, editor.selectionStart);
    const lines = beforeCaret.split('\n');
    const row = lines.length - 1;
    const col = lines[lines.length - 1].length;

    let top = paddingTop + (row + 1) * lineHeight - editor.scrollTop;
    let left = paddingLeft + col * charWidth - editor.scrollLeft;

    const maxTop = editorWrap.clientHeight - 20;
    const maxLeft = editorWrap.clientWidth - 180;
    top = Math.min(Math.max(top, 0), maxTop);
    left = Math.min(Math.max(left, 0), Math.max(maxLeft, 0));

    autocompleteBox.style.top = top + 'px';
    autocompleteBox.style.left = left + 'px';
  }

  function insertTag(tagName) {
    const val = editor.value;
    const caret = editor.selectionStart;
    const before = val.substring(0, acStart);
    const after = val.substring(caret);
    if (SELF_CLOSING.has(tagName)) {
      const insertion = tagName + ' />';
      editor.value = before + insertion + after;
      const newPos = before.length + insertion.length;
      editor.setSelectionRange(newPos, newPos);
    } else {
      const insertion = tagName + '></' + tagName + '>';
      editor.value = before + insertion + after;
      const newPos = before.length + tagName.length + 1;
      editor.setSelectionRange(newPos, newPos);
    }
    closeAutocomplete();
    scheduleRender();
    editor.focus();
  }

  autocompleteBox.addEventListener('mousedown', (e) => {
    const item = e.target.closest('.item');
    if (!item) return;
    e.preventDefault();
    const i = parseInt(item.dataset.i, 10);
    insertTag(acItems[i][0]);
  });

  function updateAutocompleteHighlight() {
    [...autocompleteBox.children].forEach((el, i) => {
      el.classList.toggle('active', i === acIndex);
    });
    const activeEl = autocompleteBox.children[acIndex];
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- AUTOCORRECT (common spelling mistakes, works in all 3 tabs) ---------- */
  const CORRECTIONS = {
    'teh':'the','hte':'the','recieve':'receive','recieved':'received','seperate':'separate',
    'seperated':'separated','definately':'definitely','occured':'occurred','adress':'address',
    'wich':'which','thier':'their','alot':'a lot','becuase':'because','diffrent':'different',
    'enviroment':'environment','goverment':'government','neccessary':'necessary','beleive':'believe',
    'acheive':'achieve','arguement':'argument','begining':'beginning','calender':'calendar',
    'concious':'conscious','embarass':'embarrass','existance':'existence','gaurd':'guard',
    'independant':'independent','knowlege':'knowledge','maintainance':'maintenance',
    'noticable':'noticeable','ocassion':'occasion','persistant':'persistent','priviledge':'privilege',
    'publically':'publicly','recomend':'recommend','refered':'referred','relevent':'relevant',
    'succesful':'successful','tommorow':'tomorrow','untill':'until','wierd':'weird',
    'writting':'writing','youre':"you're",'dont':"don't",'cant':"can't",'wont':"won't",
    'im':"I'm",'labelled':'labeled','favour':'favor','colour':'color'
  };

  function showToast(original, corrected) {
    correctToast.textContent = `Corrected "${original}" → "${corrected}"`;
    correctToast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => correctToast.classList.remove('show'), 1600);
  }

  // Only meaningful for the HTML tab — skip correcting inside < > tags
  function isInsideTag(text, pos) {
    if (currentTab !== 'html') return false;
    const lastOpen = text.lastIndexOf('<', pos - 1);
    const lastClose = text.lastIndexOf('>', pos - 1);
    return lastOpen > lastClose;
  }

  function tryAutocorrectBeforeCaret() {
    const pos = editor.selectionStart;
    if (pos !== editor.selectionEnd) return;
    const text = editor.value;
    if (isInsideTag(text, pos)) return;

    const before = text.substring(0, pos - 1);
    const match = before.match(/([A-Za-z']+)$/);
    if (!match) return;
    const word = match[1];
    const lower = word.toLowerCase();
    const fix = CORRECTIONS[lower];
    if (!fix || fix.toLowerCase() === lower) return;

    let replacement = fix;
    if (word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase()) {
      replacement = fix.charAt(0).toUpperCase() + fix.slice(1);
    }
    const wordStart = pos - 1 - word.length;
    const newText = text.substring(0, wordStart) + replacement + text.substring(pos - 1);
    const caretShift = replacement.length - word.length;
    editor.value = newText;
    editor.setSelectionRange(pos + caretShift, pos + caretShift);
    showToast(word, replacement);
    scheduleRender();
  }

  /* ---------- INPUT HANDLING: tags (HTML only) + autocorrect (all tabs) + tab key ---------- */
  editor.addEventListener('input', () => {
    const val = editor.value;
    const pos = editor.selectionStart;

    const lastChar = val.charAt(pos - 1);
    if (/[ .,;:!?)\]\n]/.test(lastChar)) {
      tryAutocorrectBeforeCaret();
    }

    if (currentTab === 'html') {
      const val2 = editor.value;
      const before = val2.substring(0, editor.selectionStart);
      const tagMatch = before.match(/<([a-zA-Z0-9]*)$/);
      if (tagMatch) {
        acStart = editor.selectionStart - tagMatch[1].length;
        openAutocompleteAt(tagMatch[1]);
      } else {
        closeAutocomplete();
      }
    }

    code[currentTab] = editor.value;
  });

  editor.addEventListener('keydown', (e) => {
    if (autocompleteBox.style.display === 'block') {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        acIndex = (acIndex + 1) % acItems.length;
        updateAutocompleteHighlight();
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        acIndex = (acIndex - 1 + acItems.length) % acItems.length;
        updateAutocompleteHighlight();
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        e.preventDefault();
        insertTag(acItems[acIndex][0]);
        return;
      }
      if (e.key === 'Escape') {
        closeAutocomplete();
        return;
      }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      code[currentTab] = editor.value;
      scheduleRender();
    }
  });

  editor.addEventListener('scroll', () => {
    if (autocompleteBox.style.display === 'block') positionAutocomplete();
  });

  editor.addEventListener('blur', () => setTimeout(closeAutocomplete, 150));
</script>
</body>
</html>
