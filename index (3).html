<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishwam's Instant HTML Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-soft: #f1f3f9;
    --border: #e2e6f0;
    --border-strong: #cdd4e6;
    --accent: #2563eb;
    --accent2: #7c3aed;
    --html-color: #ea580c;
    --css-color: #2563eb;
    --js-color: #ca8a04;
    --text: #101526;
    --muted: #626c86;
    --shadow-sm: 0 1px 2px rgba(16, 21, 38, .05);
    --shadow: 0 6px 20px rgba(16, 21, 38, .07);
    --shadow-lg: 0 14px 40px rgba(16, 21, 38, .10);
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }
  html, body {
    margin: 0;
    max-width: 100%;
    overflow-x: hidden;
  }
  body {
    min-height: 100%;
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  a { color: var(--accent); }

  .app {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- contact banner ---- */
  .contact {
    background: linear-gradient(135deg, #eef2ff, #f5f3ff);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 14px;
    color: #33395a;
    box-shadow: var(--shadow-sm);
  }
  .contact strong { display: block; font-size: 15px; color: var(--text); margin-bottom: 2px; }
  .contact a { font-weight: 700; word-break: break-all; text-decoration: none; }
  .contact a:hover { text-decoration: underline; }

  /* ---- header ---- */
  header {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
  }
  .brand { display: flex; min-width: 0; align-items: center; gap: 12px; }
  .brand img {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 12px;
    background: var(--panel-soft);
    border: 1px solid var(--border);
    object-fit: contain;
    padding: 4px;
  }
  header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.01em;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btns { display: flex; flex-wrap: wrap; gap: 10px; }
  button {
    min-height: 44px;
    padding: 10px 20px;
    border: none;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: var(--shadow-sm);
    transition: transform .15s, box-shadow .15s, background .15s;
    touch-action: manipulation;
  }
  button:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
  button:active { transform: translateY(0); }
  button:focus-visible { outline: 3px solid rgba(37, 99, 235, .35); outline-offset: 2px; }
  button.secondary {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border-strong);
  }
  button.secondary:hover { color: var(--accent); border-color: var(--accent); }

  /* ---- tabs ---- */
  .tabs {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    gap: 6px;
    padding: 8px;
    background: rgba(255, 255, 255, .9);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 18px;
    min-height: 42px;
    flex: 1 1 auto;
    justify-content: center;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    transition: background .15s, color .15s;
  }
  .tab .sq { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .tab[data-tab="html"] .sq { background: var(--html-color); }
  .tab[data-tab="css"] .sq { background: var(--css-color); }
  .tab[data-tab="js"] .sq { background: var(--js-color); }
  .tab:hover { background: var(--panel-soft); color: var(--text); }
  .tab.active { background: var(--panel-soft); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }

  /* ---- layout ---- */
  .layout {
    display: flex;
    align-items: stretch;
    gap: 0;
    width: 100%;
  }
  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  #editorPane { flex: 0 0 auto; width: 50%; }
  #previewPane { flex: 1 1 0; min-width: 0; }
  .pane-label {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    background: var(--panel-soft);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .pane-label .hint {
    text-transform: none;
    letter-spacing: 0;
    font-weight: 600;
    color: var(--accent2);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #editorWrap { position: relative; flex: 1 1 auto; min-height: 0; }
  #editor {
    display: block;
    width: 100%;
    height: 100%;
    resize: none;
    border: none;
    outline: none;
    background: var(--panel);
    color: #1b2136;
    caret-color: var(--accent);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 14px;
    line-height: 1.65;
    padding: 14px;
    tab-size: 2;
  }
  #editor:focus { box-shadow: inset 0 0 0 2px rgba(37, 99, 235, .25); }
  #preview {
    display: block;
    flex: 1 1 auto;
    width: 100%;
    border: none;
    background: #fff;
  }

  /* ---- divider ---- */
  .divider {
    flex: 0 0 auto;
    width: 18px;
    align-self: stretch;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: col-resize;
    touch-action: none;
    user-select: none;
  }
  .divider .grip {
    width: 6px;
    height: 54px;
    border-radius: 99px;
    background: var(--border-strong);
    transition: background .15s, height .15s;
  }
  .divider:hover .grip, .divider.dragging .grip { background: var(--accent); height: 84px; }

  /* ---- autocomplete ---- */
  #autocomplete {
    position: absolute;
    z-index: 40;
    background: #fff;
    border: 1px solid var(--border-strong);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    max-height: 230px;
    overflow-y: auto;
    min-width: 190px;
    display: none;
  }
  #autocomplete .item {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
  }
  #autocomplete .item .desc { color: var(--muted); font-size: 11px; font-family: inherit; }
  #autocomplete .item.active, #autocomplete .item:hover {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #fff;
  }
  #autocomplete .item.active .desc, #autocomplete .item:hover .desc { color: rgba(255,255,255,.8); }

  /* ---- toast ---- */
  #correctToast {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    max-width: max-content;
    background: #101526;
    color: #fff;
    font-size: 12px;
    padding: 8px 12px;
    border-radius: 10px;
    opacity: 0;
    transform: translateY(6px);
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    z-index: 40;
    box-shadow: var(--shadow-lg);
  }
  #correctToast.show { opacity: 1; transform: translateY(0); }

  footer {
    text-align: center;
    padding: 14px;
    font-size: 13px;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }
  footer span { color: var(--accent); font-weight: 700; }

  @media (min-width: 721px) {
    header {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
    }
    #editorWrap { height: clamp(360px, 62vh, 720px); }
    #previewPane { min-height: 0; }
  }

  /* ---- mobile: stacked, page scrolls ---- */
  @media (max-width: 720px) {
    .app { padding: 12px 12px 24px; gap: 12px; }
    .layout { flex-direction: column; }
    #editorPane, #previewPane { width: 100%; flex: 0 0 auto; }
    #editorWrap { height: 320px; }
    #preview { height: 380px; }
    .divider { width: 100%; height: 26px; cursor: row-resize; }
    .divider .grip { width: 60px; height: 6px; }
    .divider:hover .grip, .divider.dragging .grip { width: 90px; height: 6px; }
    header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="contact">
    <strong>🚀 Need a Website?</strong>
    For professional website development, mail us at:
    <a href="mailto:patelharsha680@gmail.com">patelharsha680@gmail.com</a>
  </div>

  <header>
    <div class="brand">
      <img src="511frEOE2qL.png" alt="Vishwam's Instant HTML Viewer logo">
      <div style="min-width:0">
        <h1>Vishwam's Instant HTML Viewer</h1>
        <div class="sub">HTML · CSS · JS · live preview · tag suggest · auto spell-fix</div>
      </div>
    </div>
    <div class="btns">
      <button class="secondary" id="clearBtn" type="button">Clear</button>
      <button id="downloadBtn" type="button">Download</button>
    </div>
  </header>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="html"><span class="sq"></span>HTML</div>
    <div class="tab" data-tab="css"><span class="sq"></span>CSS</div>
    <div class="tab" data-tab="js"><span class="sq"></span>JS</div>
  </div>

  <div class="layout" id="layout">
    <section class="pane" id="editorPane">
      <div class="pane-label">
        <span id="paneLabelText">Code — HTML</span>
        <span class="hint" id="paneHint">type &lt; for tag suggestions</span>
      </div>
      <div id="editorWrap">
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="Paste or type your code here..."></textarea>
        <div id="autocomplete"></div>
        <div id="correctToast"></div>
      </div>
    </section>

    <div class="divider" id="divider" role="separator" aria-label="Resize editor and preview" tabindex="0">
      <div class="grip"></div>
    </div>

    <section class="pane" id="previewPane">
      <div class="pane-label"><span>Preview</span><span class="hint">live</span></div>
      <iframe id="preview" title="Live preview" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
    </section>
  </div>

  <footer>Developer: <span>Vishwam Patel</span></footer>
</div>

<script>
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const clearBtn = document.getElementById('clearBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const autocompleteBox = document.getElementById('autocomplete');
  const correctToast = document.getElementById('correctToast');
  const editorWrap = document.getElementById('editorWrap');
  const tabs = document.querySelectorAll('.tab');
  const paneLabelText = document.getElementById('paneLabelText');
  const paneHint = document.getElementById('paneHint');
  const layout = document.getElementById('layout');
  const divider = document.getElementById('divider');
  const editorPane = document.getElementById('editorPane');

  /* ---------- MULTI-TAB STATE ---------- */
  const code = {
    html: `<h1>Hello, Vishwam!</h1>
<p>Edit HTML, CSS, and JS in separate tabs — the preview combines all three instantly.</p>
<button id="demoBtn">Click me</button>`,
    css: `body {
  font-family: sans-serif;
  background: #ffffff;
  color: #101526;
  padding: 24px;
}
h1 { color: #2563eb; }
button {
  background: #7c3aed;
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 8px;
  cursor: pointer;
}`,
    js: `document.getElementById('demoBtn').addEventListener('click', () => {
  alert('JS is wired up!');
});`
  };
  let currentTab = 'html';

  const TAB_META = {
    html: { label: 'Code — HTML', hint: 'type < for tag suggestions' },
    css:  { label: 'Code — CSS',  hint: 'auto spell-fix on comments/text' },
    js:   { label: 'Code — JS',   hint: 'auto spell-fix on comments/text' }
  };

  function loadTab(tab) {
    code[currentTab] = editor.value;
    currentTab = tab;
    editor.value = code[tab];
    paneLabelText.textContent = TAB_META[tab].label;
    paneHint.textContent = TAB_META[tab].hint;
    closeAutocomplete();
    editor.focus();
  }

  tabs.forEach(t => {
    t.addEventListener('click', () => {
      tabs.forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      loadTab(t.dataset.tab);
    });
  });

  editor.value = code.html;

  /* ---------- LIVE PREVIEW (rAF-throttled) ---------- */
  let renderQueued = false;
  function buildDoc() {
    code[currentTab] = editor.value;
    return `<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
${code.css}
</style>
</head>
<body>
${code.html}
<script>
${code.js}
<\/script>
</body>
</html>`;
  }
  function render() {
    preview.srcdoc = buildDoc();
    renderQueued = false;
  }
  function scheduleRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(render);
  }
  editor.addEventListener('input', scheduleRender);
  render();

  clearBtn.addEventListener('click', () => {
    editor.value = '';
    code[currentTab] = '';
    editor.focus();
    scheduleRender();
  });

  downloadBtn.addEventListener('click', () => {
    const blob = new Blob([buildDoc()], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'vishwam-page.html';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  /* ---------- RESIZABLE DIVIDER ---------- */
  const isMobile = () => window.matchMedia('(max-width: 720px)').matches;
  let dragging = false;

  function onDragMove(clientX, clientY) {
    if (isMobile()) {
      const rect = editorWrap.getBoundingClientRect();
      const h = Math.min(Math.max(clientY - rect.top, 160), 900);
      editorWrap.style.height = h + 'px';
    } else {
      const rect = layout.getBoundingClientRect();
      const min = 220;
      const max = rect.width - 260;
      const w = Math.min(Math.max(clientX - rect.left, min), Math.max(max, min));
      editorPane.style.width = w + 'px';
    }
  }

  divider.addEventListener('pointerdown', (e) => {
    dragging = true;
    divider.classList.add('dragging');
    divider.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  divider.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    e.preventDefault();
    onDragMove(e.clientX, e.clientY);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    divider.classList.remove('dragging');
    try { divider.releasePointerCapture(e.pointerId); } catch (_) {}
  };
  divider.addEventListener('pointerup', endDrag);
  divider.addEventListener('pointercancel', endDrag);

  divider.addEventListener('keydown', (e) => {
    if (isMobile()) return;
    const step = 24;
    const cur = editorPane.getBoundingClientRect().width;
    if (e.key === 'ArrowLeft') { e.preventDefault(); editorPane.style.width = Math.max(cur - step, 220) + 'px'; }
    if (e.key === 'ArrowRight') { e.preventDefault(); editorPane.style.width = Math.min(cur + step, layout.getBoundingClientRect().width - 260) + 'px'; }
  });

  window.addEventListener('resize', () => {
    if (isMobile()) {
      editorPane.style.width = '';
    } else {
      editorWrap.style.height = '';
    }
  });

  /* ---------- TAG AUTOCOMPLETE (HTML tab) ---------- */
  const TAGS = [
    ['a','link'],['abbr','abbreviation'],['article','article'],['aside','aside'],['audio','audio player'],
    ['b','bold'],['blockquote','quote block'],['body','body'],['br','line break'],['button','button'],
    ['canvas','canvas'],['caption','table caption'],['code','code'],['col','column'],['colgroup','column group'],
    ['datalist','datalist'],['dd','description'],['details','details'],['dialog','dialog'],['div','container'],
    ['dl','description list'],['dt','term'],['em','emphasis'],['embed','embed'],['fieldset','fieldset'],
    ['figcaption','figure caption'],['figure','figure'],['footer','footer'],['form','form'],
    ['h1','heading 1'],['h2','heading 2'],['h3','heading 3'],['h4','heading 4'],['h5','heading 5'],['h6','heading 6'],
    ['head','head'],['header','header'],['hgroup','heading group'],['hr','horizontal rule'],['html','root'],
    ['i','italic'],['iframe','iframe'],['img','image'],['input','input field'],['ins','inserted'],
    ['kbd','keyboard'],['label','label'],['legend','legend'],['li','list item'],['link','stylesheet link'],
    ['main','main content'],['map','image map'],['mark','highlight'],['menu','menu'],['meta','metadata'],
    ['meter','meter'],['nav','navigation'],['noscript','noscript'],['object','object'],['ol','ordered list'],
    ['optgroup','option group'],['option','select option'],['output','output'],['p','paragraph'],
    ['picture','picture'],['pre','preformatted'],['progress','progress'],['q','quote'],['s','strikethrough'],
    ['samp','sample output'],['script','script'],['section','section'],['select','dropdown'],['small','small text'],
    ['source','media source'],['span','inline container'],['strong','strong'],['style','style block'],
    ['sub','subscript'],['summary','summary'],['sup','superscript'],['svg','svg'],['table','table'],
    ['tbody','table body'],['td','table cell'],['template','template'],['textarea','textarea'],
    ['tfoot','table footer'],['th','table header'],['thead','table head'],['time','time'],['title','title'],
    ['tr','table row'],['track','media track'],['u','underline'],['ul','unordered list'],['var','variable'],
    ['video','video player'],['wbr','word break']
  ];
  const SELF_CLOSING = new Set(['br','hr','img','input','meta','link','source','track','embed','col','wbr']);

  let acItems = [];
  let acIndex = -1;
  let acStart = -1;

  function closeAutocomplete() {
    autocompleteBox.style.display = 'none';
    acItems = [];
    acIndex = -1;
    acStart = -1;
  }

  function openAutocompleteAt(query) {
    const q = query.toLowerCase();
    acItems = TAGS.filter(t => t[0].startsWith(q));
    if (acItems.length === 0) { closeAutocomplete(); return; }
    acIndex = 0;
    autocompleteBox.innerHTML = acItems.map((t, i) =>
      `<div class="item${i === 0 ? ' active' : ''}" data-i="${i}"><span>&lt;${t[0]}&gt;</span><span class="desc">${t[1]}</span></div>`
    ).join('');
    positionAutocomplete();
    autocompleteBox.style.display = 'block';
  }

  let charWidthCache = null;
  function getCharWidth() {
    if (charWidthCache) return charWidthCache;
    const span = document.createElement('span');
    span.style.font = getComputedStyle(editor).font;
    span.style.position = 'absolute';
    span.style.visibility = 'hidden';
    span.style.whiteSpace = 'pre';
    span.textContent = '0000000000';
    document.body.appendChild(span);
    charWidthCache = span.getBoundingClientRect().width / 10;
    document.body.removeChild(span);
    return charWidthCache;
  }

  function positionAutocomplete() {
    const style = getComputedStyle(editor);
    const paddingLeft = parseFloat(style.paddingLeft) || 0;
    const paddingTop = parseFloat(style.paddingTop) || 0;
    let lineHeight = parseFloat(style.lineHeight);
    if (isNaN(lineHeight)) lineHeight = parseFloat(style.fontSize) * 1.65;
    const charWidth = getCharWidth();

    const beforeCaret = editor.value.substring(0, editor.selectionStart);
    const lines = beforeCaret.split('\n');
    const row = lines.length - 1;
    const col = lines[lines.length - 1].length;

    let top = paddingTop + (row + 1) * lineHeight - editor.scrollTop;
    let left = paddingLeft + col * charWidth - editor.scrollLeft;

    const maxTop = editorWrap.clientHeight - 24;
    const maxLeft = editorWrap.clientWidth - 200;
    top = Math.min(Math.max(top, 0), Math.max(maxTop, 0));
    left = Math.min(Math.max(left, 0), Math.max(maxLeft, 0));

    autocompleteBox.style.top = top + 'px';
    autocompleteBox.style.left = left + 'px';
  }

  function insertTag(tagName) {
    const val = editor.value;
    const caret = editor.selectionStart;
    const before = val.substring(0, acStart);
    const after = val.substring(caret);
    if (SELF_CLOSING.has(tagName)) {
      const insertion = tagName + ' />';
      editor.value = before + insertion + after;
      const newPos = before.length + insertion.length;
      editor.setSelectionRange(newPos, newPos);
    } else {
      const insertion = tagName + '></' + tagName + '>';
      editor.value = before + insertion + after;
      const newPos = before.length + tagName.length + 1;
      editor.setSelectionRange(newPos, newPos);
    }
    code[currentTab] = editor.value;
    closeAutocomplete();
    scheduleRender();
    editor.focus();
  }

  function pickFrom(e) {
    const item = e.target.closest('.item');
    if (!item) return;
    e.preventDefault();
    const i = parseInt(item.dataset.i, 10);
    if (acItems[i]) insertTag(acItems[i][0]);
  }
  autocompleteBox.addEventListener('mousedown', pickFrom);
  autocompleteBox.addEventListener('touchstart', pickFrom, { passive: false });

  function updateAutocompleteHighlight() {
    [...autocompleteBox.children].forEach((el, i) => el.classList.toggle('active', i === acIndex));
    const activeEl = autocompleteBox.children[acIndex];
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
  }

  /* ---------- AUTOCORRECT ---------- */
  const CORRECTIONS = {
    'teh':'the','hte':'the','recieve':'receive','recieved':'received','seperate':'separate',
    'seperated':'separated','definately':'definitely','occured':'occurred','adress':'address',
    'wich':'which','thier':'their','alot':'a lot','becuase':'because','diffrent':'different',
    'enviroment':'environment','goverment':'government','neccessary':'necessary','beleive':'believe',
    'acheive':'achieve','arguement':'argument','begining':'beginning','calender':'calendar',
    'concious':'conscious','embarass':'embarrass','existance':'existence','gaurd':'guard',
    'independant':'independent','knowlege':'knowledge','maintainance':'maintenance',
    'noticable':'noticeable','ocassion':'occasion','persistant':'persistent','priviledge':'privilege',
    'publically':'publicly','recomend':'recommend','refered':'referred','relevent':'relevant',
    'succesful':'successful','tommorow':'tomorrow','untill':'until','wierd':'weird',
    'writting':'writing','youre':"you're",'dont':"don't",'cant':"can't",'wont':"won't",
    'im':"I'm",'labelled':'labeled','favour':'favor','colour':'color'
  };

  function showToast(original, corrected) {
    correctToast.textContent = `Corrected "${original}" → "${corrected}"`;
    correctToast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => correctToast.classList.remove('show'), 1600);
  }

  function isInsideTag(text, pos) {
    if (currentTab !== 'html') return false;
    const lastOpen = text.lastIndexOf('<', pos - 1);
    const lastClose = text.lastIndexOf('>', pos - 1);
    return lastOpen > lastClose;
  }

  function tryAutocorrectBeforeCaret() {
    const pos = editor.selectionStart;
    if (pos !== editor.selectionEnd) return;
    const text = editor.value;
    if (isInsideTag(text, pos)) return;

    const before = text.substring(0, pos - 1);
    const match = before.match(/([A-Za-z']+)$/);
    if (!match) return;
    const word = match[1];
    const lower = word.toLowerCase();
    const fix = CORRECTIONS[lower];
    if (!fix || fix.toLowerCase() === lower) return;

    let replacement = fix;
    if (word[0] === word[0].toUpperCase() && word[0] !== word[0].toLowerCase()) {
      replacement = fix.charAt(0).toUpperCase() + fix.slice(1);
    }
    const wordStart = pos - 1 - word.length;
    const newText = text.substring(0, wordStart) + replacement + text.substring(pos - 1);
    const caretShift = replacement.length - word.length;
    editor.value = newText;
    editor.setSelectionRange(pos + caretShift, pos + caretShift);
    code[currentTab] = editor.value;
    showToast(word, replacement);
    scheduleRender();
  }

  /* ---------- INPUT HANDLING ---------- */
  editor.addEventListener('input', () => {
    const val = editor.value;
    const pos = editor.selectionStart;
    const lastChar = val.charAt(pos - 1);
    if (/[ .,;:!?)\]\n]/.test(lastChar)) tryAutocorrectBeforeCaret();

    if (currentTab === 'html') {
      const val2 = editor.value;
      const before = val2.substring(0, editor.selectionStart);
      const tagMatch = before.match(/<([a-zA-Z0-9]*)$/);
      if (tagMatch) {
        acStart = editor.selectionStart - tagMatch[1].length;
        openAutocompleteAt(tagMatch[1]);
      } else {
        closeAutocomplete();
      }
    }
    code[currentTab] = editor.value;
  });

  editor.addEventListener('keydown', (e) => {
    if (autocompleteBox.style.display === 'block') {
      if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = (acIndex + 1) % acItems.length; updateAutocompleteHighlight(); return; }
      if (e.key === 'ArrowUp') { e.preventDefault(); acIndex = (acIndex - 1 + acItems.length) % acItems.length; updateAutocompleteHighlight(); return; }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); insertTag(acItems[acIndex][0]); return; }
      if (e.key === 'Escape') { closeAutocomplete(); return; }
    }

    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      code[currentTab] = editor.value;
      scheduleRender();
    }
  });

  editor.addEventListener('scroll', () => {
    if (autocompleteBox.style.display === 'block') positionAutocomplete();
  });
  editor.addEventListener('blur', () => setTimeout(closeAutocomplete, 200));
</script>
</body>
</html>
